name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/deploy-kgmcgc]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # enablement turns Pages on and points it at Actions on the first run, so
      # the deploy does not need Settings -> Pages set by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is a prerendered snapshot committed to the repo, so there is
      # nothing to build - the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
